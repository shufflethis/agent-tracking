name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Snippet builds and stays under five kilobytes
        run: |
          node scripts/build-snippet.mjs
          size=$(stat -c %s public/agent.js)
          echo "agent.js is $size bytes"
          test "$size" -lt 5120
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SITE_ORIGIN: https://agenttracking.co
