# /etc/nginx/sites-available/agenttracking.co
# certbot --nginx -d agenttracking.co -d www.agenttracking.co adds the TLS blocks.
server {
    listen 80;
    listen [::]:80;
    server_name agenttracking.co www.agenttracking.co;

    access_log /var/log/nginx/agenttracking.access.log;

    location / {
        proxy_pass http://127.0.0.1:3058;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 70m;
    }
}
